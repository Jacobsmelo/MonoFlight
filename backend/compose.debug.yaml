services:
  monoflight:
    image: monoflight
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn backend.app\\main:app --host 0.0.0.0 --port 8000"]
    ports:
      - 8000:8000
      - 3000:3000
      - 5678:5678
